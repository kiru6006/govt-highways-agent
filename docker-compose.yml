version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tn_hdos_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./tn_hdos.db
      - SECRET_KEY=tn-hdos-secret-key-production-enterprise-2026
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tn_hdos_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

