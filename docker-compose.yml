version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: tn_hdos_db
    environment:
      POSTGRES_DB: tn_hdos
      POSTGRES_USER: tn_hdos_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tn_hdos_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tn_hdos_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://tn_hdos_admin:${DB_PASSWORD:-tn_hdos_secure_pass_2026}@db:5432/tn_hdos
      - SECRET_KEY=${SECRET_KEY:-tn-hdos-secret-key-production-enterprise-2026}
    depends_on:
      - db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tn_hdos_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

